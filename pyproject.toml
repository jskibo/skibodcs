[project]
name = "skibodcs"
version = "0.4.0"
description = "Local-LLM scenario builder for DCS World (step 1: spec -> validate -> .miz)"
requires-python = ">=3.11"
dependencies = ["pydcs", "pydantic>=2", "pyproj"]

[project.optional-dependencies]
voice = ["faster-whisper", "sounddevice", "soundfile", "numpy", "pygame"]

[project.scripts]
skibodcs = "skibodcs.cli:main"
skibodcs-voice = "skibodcs.voice.app:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["skibodcs", "skibodcs.voice"]
