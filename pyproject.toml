[project]
name = "skibodcs"
version = "0.9.0"
description = "Voice-controlled DCS companion: natural-language comms, cockpit and wingman control, mission and campaign builder"
requires-python = ">=3.11"
dependencies = ["pydcs", "pydantic>=2", "pyproj", "pillow"]

[project.optional-dependencies]
voice = ["faster-whisper", "sounddevice", "soundfile", "numpy", "pygame", "piper-tts", "keyboard"]

[project.scripts]
skibodcs = "skibodcs.cli:main"
skibodcs-voice = "skibodcs.voice.app:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["skibodcs", "skibodcs.voice"]

[tool.setuptools.package-data]
skibodcs = ["web/*.html"]
